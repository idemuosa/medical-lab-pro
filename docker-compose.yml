services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=ehr_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password

  redis:
    image: redis:7

  backend_django:
    build:
      context: ./backend_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend_django:/app
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/ehr_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend_django
    command: celery -A ehr_core worker --loglevel=info
    volumes:
      - ./backend_django:/app
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/ehr_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  backend_fastapi:
    build:
      context: ./backend_fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    volumes:
      - ./backend_fastapi:/app
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend_next
    ports:
      - "3000:3000"
    volumes:
      - ./frontend_next:/app
    depends_on:
      - backend_django

  socket_server:
    build:
      context: ./socket_server
    ports:
      - "4000:4000"
    volumes:
      - ./socket_server:/app

volumes:
  postgres_data:
